# Build e publicacao no GitHub Pages a cada push na main.
# O site mora em https://viniciussatoj.github.io/flavio-ja-foi-preso/:
# BASE_PATH e a pasta (vite.config.js) e SITE_URL o endereco completo,
# que as paginas de compartilhamento usam nas previas (og:image).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /flavio-ja-foi-preso/
          SITE_URL: https://viniciussatoj.github.io/flavio-ja-foi-preso
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
